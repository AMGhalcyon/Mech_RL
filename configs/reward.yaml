# Reward parameters.
# Matches RewardParams in src/mech_rl/domain/parameters.py

# Distance penalty coefficient (linear distance to target)
distance_coef: 0.5

# Effort penalty coefficient (||tau||^2)
effort_coef: 0.01

# Smoothness penalty coefficient (||tau_t - tau_{t-1}||^2)
smoothness_coef: 0.0

# Success bonus (received when ee is within success_radius of target)
success_bonus: 0.0

# Success radius (m)
success_radius: 0.05

# Time penalty per step (encourages speed)
time_penalty: 0.01
